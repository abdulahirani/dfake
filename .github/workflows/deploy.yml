name: Sync to Hugging Face and Deploy to Firebase

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 1. Install & Build
      - name: Install & Build
        run: |
          npm install
          npm run build

      # 2. Deploy to Firebase (Static Hosting)
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SCANDEEPFAKE }}'
          projectId: '60350182033'
          channelId: live

      # 3. Hugging Face Sync (Full Docker App)
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "gundkatira007@gmail.com"
          git config --global user.name "Gund Katira"
          git remote add hf https://gundkatira:$HF_TOKEN@huggingface.co/spaces/gundkatira/scandeepfake-scanner || git remote set-url hf https://gundkatira:$HF_TOKEN@huggingface.co/spaces/gundkatira/scandeepfake-scanner
          git push --force hf main
