name: Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Generate Frontend Assets
      run: npm run build

    - name: Prepare Native Assets
      run: |
        npm run assets:prepare
        
        # Clean native resources to prevent merge conflicts
        if [ -d "android/app/src/main/res" ]; then
          find android/app/src/main/res -name "ic_launcher*" -delete
          find android/app/src/main/res -name "splash*" -delete
        fi
        
        npm run assets:generate

    - name: Sync Capacitor
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi
        
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        ADMOB_APP_ID="ca-app-pub-5955602053283707~3790849033"
        
        # Ensure directory exists for fresh adds
        mkdir -p $(dirname "$MANIFEST_PATH")
        
        # 1. Inject AdMob App ID
        if [ ! -f "$MANIFEST_PATH" ] || ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST_PATH"; then
          # If file doesn't exist, we'll let capacitor sync handle it first or create a skeleton
          # Actually, we should sync first THEN patch if we want to be safe, or patch the template.
          # Syncing first is better for consistency.
          echo "Manifest patching will happen after initial sync if not present."
        fi

        npx cap sync android

        # Post-sync patch to ensure all requirements are met
        # 1. Inject AdMob App ID
        if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST_PATH"; then
          sed -i "/<\/application>/i \        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"\/>" "$MANIFEST_PATH"
        fi

        # 2. Add Runtime Permissions
        for perm in "INTERNET" "ACCESS_NETWORK_STATE" "CAMERA" "READ_EXTERNAL_STORAGE" "WRITE_EXTERNAL_STORAGE" "READ_MEDIA_IMAGES" "READ_MEDIA_VIDEO"; do
          if ! grep -q "android.permission.$perm" "$MANIFEST_PATH"; then
            sed -i "/<manifest/a \    <uses-permission android:name=\"android.permission.$perm\" \/>" "$MANIFEST_PATH"
          fi
        done

        # 3. Enable Hardware Acceleration
        if ! grep -q "android:hardwareAccelerated" "$MANIFEST_PATH"; then
          sed -i 's/<application/<application android:hardwareAccelerated="true"/' "$MANIFEST_PATH"
        fi

    - name: Build with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: scandeepfake-binary-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
