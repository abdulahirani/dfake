name: Android Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Generate Frontend Assets
      run: npm run build

    - name: Sync Capacitor
      run: |
        # If android folder exists but is broken (missing gradlew or corrupt wrapper jar), remove it
        if [ -d "android" ]; then
          BROKEN=false
          if [ ! -f "android/gradlew" ]; then BROKEN=true; fi
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then BROKEN=true; fi
          
          # Check jar integrity
          if [ "$BROKEN" = "false" ]; then
            if ! java -jar android/gradle/wrapper/gradle-wrapper.jar --version > /dev/null 2>&1; then
              echo "Gradle wrapper jar is corrupt."
              BROKEN=true
            fi
          fi

          if [ "$BROKEN" = "true" ]; then
            echo "Android folder is broken. Recreating..."
            rm -rf android
          fi
        fi

        if [ ! -d "android" ]; then
          npx cap add android
        fi
        
        npx cap sync android

    - name: Prepare Native Assets
      run: |
        npm run assets:prepare
        
        # Clean native resources to prevent merge conflicts
        if [ -d "android/app/src/main/res" ]; then
          find android/app/src/main/res -name "ic_launcher*" -delete
          find android/app/src/main/res -name "splash*" -delete
        fi
        
        npm run assets:generate

    - name: Patch Android Manifest
      run: |
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        ADMOB_APP_ID="ca-app-pub-5955602053283707~3790849033"
        
        # 1. Inject AdMob App ID if not present
        if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST_PATH"; then
          sed -i "/<\/application>/i \        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$ADMOB_APP_ID\"\/>" "$MANIFEST_PATH"
        fi

        # 2. Add Runtime Permissions if not present
        for perm in "INTERNET" "ACCESS_NETWORK_STATE" "CAMERA" "READ_EXTERNAL_STORAGE" "WRITE_EXTERNAL_STORAGE" "READ_MEDIA_IMAGES" "READ_MEDIA_VIDEO"; do
          if ! grep -q "android.permission.$perm" "$MANIFEST_PATH"; then
            sed -i "/<manifest/a \    <uses-permission android:name=\"android.permission.$perm\" \/>" "$MANIFEST_PATH"
          fi
        done

        # 3. Enable Hardware Acceleration if not present
        if ! grep -q "android:hardwareAccelerated" "$MANIFEST_PATH"; then
          sed -i 's/<application/<application android:hardwareAccelerated="true"/' "$MANIFEST_PATH"
        fi

    - name: Build with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: scandeepfake-binary-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
